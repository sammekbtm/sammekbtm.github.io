name: veri-guncelle-ve-yayinla
on:
  schedule:
    - cron: "*/5 6-15 * * 1-5"   # BIST seansı (TR 09:00-18:59) her 5 dk
    - cron: "17 */2 * * *"       # seans dışı 2 saatte bir (kapanış + haberler)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Önbellek (geçmiş fiyat + haber)
        uses: actions/cache@v4
        with:
          path: |
            data/h
            data/n
            data/meta.json
            data/quotes.json
            data/lv
          key: data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-
      - name: Verileri güncelle
        run: python scripts/update.py
      - name: Günlük emir seviyeleri + haber etkisi
        run: node scripts/levels.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
