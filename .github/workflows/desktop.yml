name: windows-uygulama
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Sürüm yayınla (Release)
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="app-v$V"
          ls -la dist
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "sammekBTM Windows uygulaması v$V" --notes "sammekBTM masaüstü uygulaması. Kurulum: sammekBTM-Kurulum.exe dosyasını indirip çalıştırın. Uygulama her açılışta canlı siteyi (https://sammekbtm.github.io/) yükler, bu yüzden hep güncel kalır. İmzasız olduğu için Windows SmartScreen uyarısında 'Ek bilgi → Yine de çalıştır' seçin." --latest
          gh release upload "$TAG" "dist/sammekBTM-Kurulum.exe" --clobber
